[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learnops-flow"
version = "0.1.0"
description = "Synthetic-data learning operations portfolio demo"
requires-python = ">=3.12,<3.14"
dependencies = ["streamlit==1.50.0", "pandas==2.3.3", "tzdata==2025.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
learning_ops = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
